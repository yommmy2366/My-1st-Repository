<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        html, 
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%; 
            background-color: #f0f0f0;
        }
        .profile-header {
            color: black;
            font-size: 2em;
            text-align: center;
            margin-top: 20px;
        }
        .profile-content {
            color: #666;
            font-size: 1.2em;
            text-align: center;
            margin-top: 10px;
        }
        .profile-header1 {
            color: blue;
            font-size: 2em;
            text-align: center;
            margin-top: 20px;
        }
        .profile-content2 {
            color: #666;
            font-size: 1.2em;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div>
    <h1 class="profile-header">1st Title</h1>
    <p class="profile-content">lorem ipsum dolor sit amet</p>
    </div>

    <div>
    <h1 class="profile-header1">2nd Title</h1>
    <p class="profile-content2">lorem ipsum dolor sit amet</p>
    </div>
</body>
</html>
